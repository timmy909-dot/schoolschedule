// =========================
// 시간표 생성
// =========================

function createScheduleTable(periods = 7){

    scheduleBody.innerHTML="";

    for(let i=1;i<=periods;i++){

        const row=document.createElement("tr");

        row.innerHTML=`
            <th>${i}교시</th>
            <td id="mon${i}"></td>
            <td id="tue${i}"></td>
            <td id="wed${i}"></td>
            <td id="thu${i}"></td>
            <td id="fri${i}"></td>
        `;

        scheduleBody.appendChild(row);

    }

}

// =========================
// 이번주 월~금 날짜 구하기
// =========================

function getWeekDates(){

    const today=new Date();

    const day=today.getDay();

    const monday=new Date(today);

    monday.setDate(today.getDate()-(day===0?6:day-1));

    const result=[];

    for(let i=0;i<5;i++){

        const d=new Date(monday);

        d.setDate(monday.getDate()+i);

        const y=d.getFullYear();

        const m=String(d.getMonth()+1).padStart(2,"0");

        const dd=String(d.getDate()).padStart(2,"0");

        result.push(`${y}${m}${dd}`);

    }

    return result;

}

// =========================
// NEIS에서 시간표 불러오기
// =========================

async function loadTimetable(){

    createScheduleTable();

    const school=schoolSelect.value;
    const grade=gradeSelect.value;
    const cls=classSelect.value;

    const office=schoolInfo[school].office;
    const schoolCode=schoolInfo[school].code;

    const week=getWeekDates();

// 급식표에 날짜 표시
const dateCells = document.querySelectorAll(".eat tr:first-child td");

week.forEach((date, index) => {
    const month = date.substring(4, 6);
    const day = date.substring(6, 8);

    dateCells[index].textContent = `${month}/${day}`;
});

    const days=["mon","tue","wed","thu","fri"];

    for(let d=0;d<5;d++){

        const url=
  `https://tiny-unit-2067.gunyul8177.workers.dev/?office=${office}&school=${schoolCode}&grade=${grade}&class=${cls}&date=${week[d]}`;
        try{

            const response=await fetch(url);

            const data=await response.json();

            if(!data.misTimetable) continue;

            const rows=data.misTimetable[1].row;

            rows.forEach(item=>{

                const period=item.PERIO;

                const subject=item.ITRT_CNTNT;

                const cell=document.getElementById(days[d]+period);

                if(cell){

                    cell.textContent=subject;

                }

            });

        }catch(e){

            console.log(e);

        }

    }
highlightTodayAndCurrentClass();
}

// =========================
// 현재 요일 / 현재 교시 하이라이트
// =========================

function highlightTodayAndCurrentClass() {

    const now = new Date();

    const dayNames = ["sun","mon","tue","wed","thu","fri","sat"];
    const today = dayNames[now.getDay()];

    const hour = now.getHours();
    const minute = now.getMinutes();

    const classTimes = [
        {start:[9,0], end:[9,45]},
        {start:[9,55], end:[10,40]},
        {start:[10,50], end:[11,35]},
        {start:[11,45], end:[12,30]},
        {start:[13,20], end:[14,5]},
        {start:[14,15], end:[15,0]},
        {start:[15,10], end:[15,55]}
    ];

    // 오늘 요일 강조
    for (let i = 1; i <= 7; i++) {

        const cell = document.getElementById(`${today}${i}`);

        if (cell) {
            cell.style.backgroundColor = "#FFFF00";
        }

    }

    // 현재 교시 강조
    const nowMinutes = hour * 60 + minute;

    classTimes.forEach((time, idx) => {

        const startMinutes = time.start[0] * 60 + time.start[1];
        const endMinutes = time.end[0] * 60 + time.end[1];

        if (nowMinutes >= startMinutes && nowMinutes <= endMinutes) {

            const cell = document.getElementById(`${today}${idx + 1}`);

            if (cell) {
                cell.style.backgroundColor = "#ADFF2F";
                cell.style.fontWeight = "bold";
            }

        }

    });

}

setInterval(highlightTodayAndCurrentClass, 60000);

function updateClass(){ 

    const school = schoolSelect.value; 
    const grade = Number(gradeSelect.value); 

    const info = schoolInfo[school]; 

    if(!info){ 
        console.error("학교 정보를 찾을 수 없습니다."); 
        return; 
    } 

    const classCount = info.classes[grade - 1]; 

    classSelect.innerHTML = ""; 

    for(let i = 1; i <= classCount; i++){ 

        const option = document.createElement("option"); 

        option.value = i; 
        option.textContent = i + "반"; 

        classSelect.appendChild(option); 

    } 

}

// 이벤트

// 노트 추가 (욕설 입력 막기 적용)
function addNote() {
    const input = document.getElementById("noteInput");
    const noteText = input.value.trim();
    if (noteText === "") return;

    // 욕설 검사
    if (bannedWords.some(word => noteText.includes(word))) {
        alert("⚠️ 입력할 수 없는 표현이 포함되어 있습니다.상대방을 배려하는 표현으로 다시 작성해 주세요. 😊")
        input.value = ""; // 입력창 비우기
        return; // 저장 및 추가 중단
    }

    createNoteElement(noteText);
    saveNotes();
    input.value = "";
}

// 노트 요소 생성
function createNoteElement(text) {
    const li = document.createElement("li");
    li.textContent = text;

    const delBtn = document.createElement("button");
    delBtn.textContent = "삭제";
    delBtn.style.marginLeft = "10px";
    delBtn.onclick = function() {
        li.remove();
        saveNotes();
    };

    li.appendChild(delBtn);
    document.getElementById("noteList").appendChild(li);
}

// 노트 저장
function saveNotes() {
    const items = document.querySelectorAll("#noteList li");
    const notes = [];
    items.forEach(li => {
        // 버튼 텍스트 제외하고 노트 내용만 저장
        notes.push(li.firstChild.textContent);
    });
    localStorage.setItem("notes", JSON.stringify(notes));
}
